<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#4C3BCF"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Goal Planner</title>
<link rel="manifest" href="gp-manifest.json"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap');

  :root {
    --bg: #0D0B1F;
    --bg2: #13112B;
    --bg3: #1A1838;
    --card: #1E1C3A;
    --card2: #252347;
    --border: #2E2B55;
    --accent: #6C5CE7;
    --accent2: #A29BFE;
    --accent3: #4C3BCF;
    --purple-light: #DDD6FE;
    --blue: #3B82F6;
    --blue-light: #93C5FD;
    --green: #10B981;
    --green-light: #6EE7B7;
    --yellow: #F59E0B;
    --red: #EF4444;
    --text: #F0EEFF;
    --text2: #A5A0C8;
    --text3: #6B6894;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 4px 24px rgba(108,92,231,0.15);
    --shadow-lg: 0 8px 40px rgba(108,92,231,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── AUTH SCREEN ── */
  #auth-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse at 30% 20%, rgba(108,92,231,0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(76,59,207,0.2) 0%, transparent 55%),
                var(--bg);
  }
  .auth-logo {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    background: linear-gradient(135deg, var(--accent2), var(--blue-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
    text-align: center;
  }
  .auth-tagline { color: var(--text2); font-size: 0.9rem; margin-bottom: 40px; text-align: center; }
  .auth-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow-lg);
  }
  .auth-tabs { display: flex; gap: 4px; background: var(--bg2); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 28px; }
  .auth-tab {
    flex: 1; padding: 10px; border: none; border-radius: 8px;
    background: transparent; color: var(--text2); font-size: 0.9rem;
    font-weight: 500; cursor: pointer; transition: all 0.2s;
  }
  .auth-tab.active { background: var(--accent); color: #fff; }
  .field-group { margin-bottom: 18px; }
  .field-group label { display: block; font-size: 0.8rem; color: var(--text2); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.03em; }
  .field-group input {
    width: 100%; padding: 12px 16px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text);
    font-size: 0.95rem; font-family: inherit; outline: none;
    transition: border-color 0.2s;
  }
  .field-group input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%; padding: 13px; background: var(--accent);
    border: none; border-radius: var(--radius-sm); color: #fff;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all 0.2s; letter-spacing: 0.02em;
  }
  .btn-primary:hover { background: var(--accent3); transform: translateY(-1px); box-shadow: var(--shadow); }
  .auth-msg { margin-top: 14px; font-size: 0.85rem; text-align: center; color: var(--text2); min-height: 20px; }
  .auth-msg.error { color: #FC8181; }
  .auth-msg.success { color: var(--green-light); }

  /* ── MAIN APP ── */
  #app { display: none; flex-direction: column; min-height: 100vh; }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,11,31,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    background: linear-gradient(135deg, var(--accent2), var(--blue-light));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .user-pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 12px 6px 8px;
    font-size: 0.8rem; color: var(--text2); cursor: pointer;
  }
  .user-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--blue));
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 700; color: #fff;
  }
  .btn-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.1rem; color: var(--text2);
    transition: all 0.2s;
  }
  .btn-icon:hover { border-color: var(--accent); color: var(--accent); }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: rgba(19,17,43,0.97); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex; padding: 8px 0 max(8px, env(safe-area-inset-bottom));
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 3px; padding: 6px 4px; cursor: pointer; transition: all 0.2s;
    border: none; background: none; color: var(--text3); font-family: inherit;
  }
  .nav-item span:first-child { font-size: 1.3rem; }
  .nav-item span:last-child { font-size: 0.65rem; font-weight: 500; letter-spacing: 0.03em; }
  .nav-item.active { color: var(--accent2); }
  .nav-item.active span:first-child { filter: drop-shadow(0 0 6px var(--accent)); }

  /* Main content */
  .main-content { flex: 1; padding: 20px 16px 100px; max-width: 600px; margin: 0 auto; width: 100%; }

  /* Sections */
  .section { display: none; }
  .section.active { display: block; }

  /* Cards */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
  }
  .card-sm { padding: 14px; }

  /* ── DASHBOARD ── */
  .greeting { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
  .greeting span { color: var(--accent2); }
  .greeting-sub { font-size: 0.85rem; color: var(--text2); margin-bottom: 20px; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .stat-card {
    background: var(--card2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 16px; text-align: center;
  }
  .stat-num { font-size: 2rem; font-weight: 700; color: var(--accent2); line-height: 1; }
  .stat-label { font-size: 0.75rem; color: var(--text2); margin-top: 4px; }

  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title { font-size: 1rem; font-weight: 600; color: var(--text); }
  .btn-sm {
    padding: 6px 14px; border-radius: 8px;
    background: var(--accent); border: none; color: #fff;
    font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: all 0.2s;
  }
  .btn-sm:hover { background: var(--accent3); }
  .btn-ghost {
    padding: 6px 14px; border-radius: 8px;
    background: transparent; border: 1px solid var(--border); color: var(--text2);
    font-size: 0.8rem; font-weight: 500; cursor: pointer; font-family: inherit;
    transition: all 0.2s;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* Goal card */
  .goal-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
  }
  .goal-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px; border-radius: 4px 0 0 4px;
  }
  .goal-card.cat-personal::before { background: var(--accent); }
  .goal-card.cat-career::before { background: var(--blue); }
  .goal-card.cat-health::before { background: var(--green); }
  .goal-card.cat-finance::before { background: var(--yellow); }
  .goal-card.cat-learning::before { background: #EC4899; }
  .goal-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
  .goal-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; padding-left: 10px; }
  .goal-title { font-weight: 600; font-size: 0.95rem; }
  .goal-badge {
    font-size: 0.7rem; font-weight: 600; padding: 3px 10px;
    border-radius: 20px; white-space: nowrap;
  }
  .badge-active { background: rgba(108,92,231,0.2); color: var(--accent2); }
  .badge-done { background: rgba(16,185,129,0.2); color: var(--green-light); }
  .badge-paused { background: rgba(245,158,11,0.2); color: #FCD34D; }
  .goal-meta { font-size: 0.75rem; color: var(--text2); margin-bottom: 10px; padding-left: 10px; }
  .progress-bar-wrap { background: var(--bg3); border-radius: 4px; height: 6px; overflow: hidden; padding-left: 10px; }
  .progress-bar-wrap { padding-left: 0; margin: 0 0 0 10px; }
  .progress-bar { height: 6px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .fill-purple { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .fill-blue { background: linear-gradient(90deg, var(--blue), var(--blue-light)); }
  .fill-green { background: linear-gradient(90deg, var(--green), var(--green-light)); }
  .fill-yellow { background: linear-gradient(90deg, var(--yellow), #FDE68A); }
  .fill-pink { background: linear-gradient(90deg, #EC4899, #F9A8D4); }
  .goal-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-left: 10px; }
  .progress-pct { font-size: 0.8rem; font-weight: 600; color: var(--accent2); }
  .due-date { font-size: 0.72rem; color: var(--text3); }

  /* Empty state */
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
  .empty-icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-text { font-size: 0.9rem; margin-bottom: 16px; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    display: flex; align-items: flex-end;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 24px 24px 0 0; padding: 24px 20px 32px;
    width: 100%; max-width: 600px; margin: 0 auto;
    max-height: 90vh; overflow-y: auto;
    transform: translateY(30px); transition: transform 0.25s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-size: 1.1rem; font-weight: 700; }
  .btn-close { background: var(--card); border: none; color: var(--text2); font-size: 1.2rem; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

  /* Form elements */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 0.8rem; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 11px 14px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text);
    font-size: 0.9rem; font-family: inherit; outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { resize: vertical; min-height: 80px; }
  .form-select option { background: var(--bg3); }
  .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cat-btn {
    padding: 8px 6px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--border); background: var(--bg3);
    color: var(--text2); font-size: 0.78rem; font-weight: 500;
    cursor: pointer; font-family: inherit; text-align: center;
    transition: all 0.2s;
  }
  .cat-btn.selected { border-color: var(--accent); background: rgba(108,92,231,0.15); color: var(--accent2); }
  .priority-grid { display: flex; gap: 8px; }
  .priority-btn {
    flex: 1; padding: 8px 4px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--border); background: var(--bg3);
    color: var(--text2); font-size: 0.8rem; font-weight: 500;
    cursor: pointer; font-family: inherit; text-align: center;
    transition: all 0.2s;
  }
  .priority-btn.high.selected { border-color: var(--red); background: rgba(239,68,68,0.15); color: #FCA5A5; }
  .priority-btn.medium.selected { border-color: var(--yellow); background: rgba(245,158,11,0.15); color: #FDE68A; }
  .priority-btn.low.selected { border-color: var(--green); background: rgba(16,185,129,0.15); color: var(--green-light); }

  /* Task list in goal detail */
  .task-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .task-item:last-child { border-bottom: none; }
  .task-check {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border); cursor: pointer;
    flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; transition: all 0.2s; margin-top: 1px;
  }
  .task-check.done { background: var(--accent); border-color: var(--accent); }
  .task-check.done::after { content: '✓'; color: #fff; font-size: 0.7rem; font-weight: 700; }
  .task-info { flex: 1; }
  .task-name { font-size: 0.9rem; font-weight: 500; }
  .task-name.done { text-decoration: line-through; color: var(--text3); }
  .task-due { font-size: 0.72rem; color: var(--text3); margin-top: 2px; }
  .task-actions { display: flex; gap: 6px; }
  .task-del { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 1rem; padding: 2px; }
  .task-del:hover { color: var(--red); }

  .add-task-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-task-row .form-input { flex: 1; }

  /* ── PROGRESS SECTION ── */
  .chart-wrap { position: relative; display: flex; justify-content: center; margin: 10px 0; }
  canvas.donut { max-width: 180px; }

  .progress-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .weekly-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 10px 0; }
  .day-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .day-label { font-size: 0.65rem; color: var(--text3); }
  .day-bar-wrap { height: 60px; display: flex; align-items: flex-end; }
  .day-bar { width: 18px; border-radius: 4px 4px 0 0; min-height: 4px; transition: height 0.4s; }
  .day-pct { font-size: 0.62rem; color: var(--text2); }

  .goal-progress-list .gpl-item {
    margin-bottom: 14px;
  }
  .gpl-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .gpl-name { font-size: 0.85rem; font-weight: 500; }
  .gpl-pct { font-size: 0.8rem; font-weight: 600; color: var(--accent2); }

  /* ── CALENDAR ── */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-month { font-size: 1.05rem; font-weight: 700; }
  .cal-nav { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; color: var(--text); cursor: pointer; font-size: 0.85rem; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day-label { text-align: center; font-size: 0.7rem; color: var(--text3); padding: 4px 0; font-weight: 600; }
  .cal-cell {
    aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; position: relative;
    cursor: pointer; transition: all 0.15s; font-size: 0.82rem;
  }
  .cal-cell:hover { background: var(--card2); }
  .cal-cell.today { background: rgba(108,92,231,0.2); color: var(--accent2); font-weight: 700; }
  .cal-cell.other-month { color: var(--text3); }
  .cal-cell.has-goals::after {
    content: ''; position: absolute; bottom: 3px;
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent2);
  }
  .cal-cell.selected { border: 1.5px solid var(--accent); }
  .cal-events { margin-top: 16px; }
  .cal-event-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .cal-event-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .cal-event-text { font-size: 0.85rem; }
  .cal-event-meta { font-size: 0.72rem; color: var(--text2); margin-top: 2px; }

  /* ── REFLECTION ── */
  .ref-date-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; -webkit-overflow-scrolling: touch; }
  .ref-date-btn {
    flex-shrink: 0; padding: 8px 14px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text2); font-size: 0.78rem; cursor: pointer;
    font-family: inherit; transition: all 0.2s;
  }
  .ref-date-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ref-entry {
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 12px;
  }
  .ref-entry-head {
    background: var(--card2); padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .ref-entry-date { font-size: 0.8rem; font-weight: 600; color: var(--accent2); }
  .ref-entry-mood { font-size: 1.1rem; }
  .ref-entry-body { padding: 14px 16px; font-size: 0.85rem; color: var(--text2); line-height: 1.6; }
  .mood-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .mood-btn {
    flex: 1; padding: 10px 4px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--border); background: var(--bg3);
    font-size: 1.3rem; cursor: pointer; text-align: center; transition: all 0.2s;
  }
  .mood-btn.selected { border-color: var(--accent); background: rgba(108,92,231,0.15); }
  .win-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; }
  .win-icon { color: var(--yellow); font-size: 0.9rem; flex-shrink: 0; margin-top: 2px; }
  .win-text { font-size: 0.85rem; color: var(--text2); }

  /* ── REPORTS ── */
  .report-tabs { display: flex; gap: 4px; background: var(--bg3); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 20px; }
  .report-tab {
    flex: 1; padding: 8px 4px; border: none; border-radius: 8px;
    background: transparent; color: var(--text2); font-size: 0.78rem;
    font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .report-tab.active { background: var(--accent); color: #fff; }

  .metric-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .metric-box { background: var(--card2); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
  .metric-val { font-size: 1.5rem; font-weight: 700; color: var(--accent2); line-height: 1; }
  .metric-lbl { font-size: 0.68rem; color: var(--text2); margin-top: 4px; }

  /* Notification */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 20px;
    font-size: 0.85rem; color: var(--text); z-index: 500;
    opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Loader */
  .loader { display: flex; justify-content: center; padding: 40px; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Detail view */
  .detail-header { margin-bottom: 20px; }

<script>
// ═══════════════════════════════════════════
//  FIREBASE CONFIG — Replace with your project
// ═══════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyBfYlifNYjb4ZbGuUoM3PICt8UoAh_FuhY",
  authDomain: "goal-planner-66f7f.firebaseapp.com",
  projectId: "goal-planner-66f7f",
  storageBucket: "goal-planner-66f7f.firebasestorage.app",
  messagingSenderId: "418961400251",
  appId: "1:418961400251:web:e983004ba259279192649e"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let currentUser = null;
let goals = [];
let reflections = [];
let editingGoalId = null;
let selectedCat = 'personal';
let selectedPriority = 'medium';
let selectedMood = '🙂';
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let selectedCalDay = null;
let currentFilter = 'all';
let currentReport = 'overview';

// ═══════════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════════
function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='signup'&&i===1)));
  document.getElementById('login-form').style.display = tab==='login'?'block':'none';
  document.getElementById('signup-form').style.display = tab==='signup'?'block':'none';
  document.getElementById('auth-msg').textContent='';
}

function setAuthMsg(msg,type='error'){
  const el=document.getElementById('auth-msg');
  el.textContent=msg; el.className='auth-msg '+(type==='success'?'success':'error');
}

async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  if(!email||!pass){setAuthMsg('Please fill all fields');return;}
  try{
    await auth.signInWithEmailAndPassword(email,pass);
  }catch(e){setAuthMsg(friendlyError(e));}
}

async function doSignup(){
  const name=document.getElementById('signup-name').value.trim();
  const email=document.getElementById('signup-email').value.trim();
  const pass=document.getElementById('signup-pass').value;
  if(!name||!email||!pass){setAuthMsg('Please fill all fields');return;}
  if(pass.length<6){setAuthMsg('Password must be 6+ characters');return;}
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    await cred.user.updateProfile({displayName:name});
    await db.collection('users').doc(cred.user.uid).set({name,email,createdAt:new Date().toISOString()});
  }catch(e){setAuthMsg(friendlyError(e));}
}

function doLogout(){
  if(confirm('Sign out?')) auth.signOut();
}

function friendlyError(e){
  const m=e.message||'';
  if(m.includes('user-not-found')||m.includes('wrong-password')||m.includes('invalid-credential')) return 'Invalid email or password.';
  if(m.includes('email-already-in-use')) return 'Email already in use.';
  if(m.includes('network')) return 'Network error. Check your connection.';
  return m;
}

auth.onAuthStateChanged(async user=>{
  if(user){
    currentUser=user;
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    const nameDisp=user.displayName||user.email.split('@')[0];
    document.getElementById('user-name-top').textContent=nameDisp;
    document.getElementById('user-avatar').textContent=nameDisp[0].toUpperCase();
    document.getElementById('dash-name').textContent=nameDisp.split(' ')[0];
    document.getElementById('dash-date').textContent=formatDateLong(new Date());
    await loadData();
    renderDashboard();
  } else {
    currentUser=null; goals=[]; reflections=[];
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app').style.display='none';
  }
});

// ═══════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════
async function loadData(){
  const uid=currentUser.uid;
  const [gSnap,rSnap]=await Promise.all([
    db.collection('users').doc(uid).collection('goals').orderBy('createdAt','desc').get(),
    db.collection('users').doc(uid).collection('reflections').orderBy('date','desc').get()
  ]);
  goals=gSnap.docs.map(d=>({id:d.id,...d.data()}));
  reflections=rSnap.docs.map(d=>({id:d.id,...d.data()}));
}

async function saveGoalToFS(g){
  const uid=currentUser.uid;
  if(g.id){
    await db.collection('users').doc(uid).collection('goals').doc(g.id).set(g);
  } else {
    const ref=await db.collection('users').doc(uid).collection('goals').add(g);
    g.id=ref.id;
  }
}

async function deleteGoalFromFS(id){
  await db.collection('users').doc(currentUser.uid).collection('goals').doc(id).delete();
}

async function saveReflectionToFS(r){
  const uid=currentUser.uid;
  if(r.id){
    await db.collection('users').doc(uid).collection('reflections').doc(r.id).set(r);
  } else {
    const ref=await db.collection('users').doc(uid).collection('reflections').add(r);
    r.id=ref.id;
  }
}

// ═══════════════════════════════════════════
//  NAV
// ═══════════════════════════════════════════
function switchSection(name, btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
  if(name==='dashboard') renderDashboard();
  if(name==='goals') renderGoalsList();
  if(name==='progress') renderReports();
  if(name==='calendar') renderCalendar();
  if(name==='reflection') renderReflections();
}

// ═══════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════
function renderDashboard(){
  const active=goals.filter(g=>g.status==='active');
  const done=goals.filter(g=>g.status==='done');
  const allTasks=goals.flatMap(g=>g.tasks||[]);
  const doneTasks=allTasks.filter(t=>t.done);
  document.getElementById('stat-total').textContent=goals.length;
  document.getElementById('stat-active').textContent=active.length;
  document.getElementById('stat-done').textContent=done.length;
  document.getElementById('stat-tasks').textContent=doneTasks.length;
  const container=document.getElementById('dash-goals-list');
  if(!active.length){
    container.innerHTML=`<div class="empty-state"><div class="empty-icon">🎯</div><div class="empty-text">No active goals yet. Create your first goal!</div><button class="btn-sm" onclick="openGoalModal()">+ New Goal</button></div>`;
    return;
  }
  container.innerHTML=active.slice(0,5).map(g=>goalCardHTML(g)).join('');
}

function goalCardHTML(g){
  const pct=calcProgress(g);
  const catColors={personal:'purple',career:'blue',health:'green',finance:'yellow',learning:'pink'};
  const color=catColors[g.category]||'purple';
  const badgeClass=g.status==='done'?'badge-done':g.status==='paused'?'badge-paused':'badge-active';
  const badgeText=g.status==='done'?'✓ Done':g.status==='paused'?'Paused':'Active';
  return `<div class="goal-card cat-${g.category}" onclick="openGoalDetail('${g.id}')">
    <div class="goal-card-header">
      <div class="goal-title">${g.title}</div>
      <div class="goal-badge ${badgeClass}">${badgeText}</div>
    </div>
    <div class="goal-meta">${catEmoji(g.category)} ${capitalize(g.category)} · ${priorityLabel(g.priority)}</div>
    <div class="progress-bar fill-${color}" style="height:6px;background:var(--bg3);border-radius:4px;margin:0 0 0 10px;overflow:hidden">
      <div class="progress-fill fill-${color}" style="width:${pct}%"></div>
    </div>
    <div class="goal-footer">
      <div class="progress-pct">${pct}%</div>
      <div class="due-date">${g.dueDate?'Due '+formatDateShort(g.dueDate):''}</div>
    </div>
  </div>`;
}

function calcProgress(g){
  if(g.status==='done') return 100;
  const tasks=g.tasks||[];
  if(!tasks.length) return g.manualProgress||0;
  return Math.round(tasks.filter(t=>t.done).length/tasks.length*100);
}

// ═══════════════════════════════════════════
//  GOALS LIST
// ═══════════════════════════════════════════
function filterGoals(cat, btn){
  currentFilter=cat;
  document.querySelectorAll('#sec-goals .ref-date-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderGoalsList();
}

function renderGoalsList(){
  const filtered=currentFilter==='all'?goals:goals.filter(g=>g.category===currentFilter);
  const container=document.getElementById('goals-full-list');
  if(!filtered.length){
    container.innerHTML=`<div class="empty-state"><div class="empty-icon">🎯</div><div class="empty-text">No goals in this category yet.</div></div>`;
    return;
  }
  container.innerHTML=filtered.map(g=>goalCardHTML(g)).join('');
}

// ═══════════════════════════════════════════
//  GOAL DETAIL
// ═══════════════════════════════════════════
function openGoalDetail(id){
  const g=goals.find(x=>x.id===id);
  if(!g) return;
  const pct=calcProgress(g);
  const catColors={personal:'purple',career:'blue',health:'green',finance:'yellow',learning:'pink',other:'purple'};
  const color=catColors[g.category]||'purple';
  const tasks=g.tasks||[];
  const taskHTML=tasks.length?tasks.map((t,i)=>`
    <div class="task-item">
      <div class="task-check ${t.done?'done':''}" onclick="toggleTask('${id}',${i})"></div>
      <div class="task-info">
        <div class="task-name ${t.done?'done':''}">${t.name}</div>
        ${t.due?`<div class="task-due">Due ${formatDateShort(t.due)}</div>`:''}
      </div>
      <div class="task-actions">
        <button class="task-del" onclick="deleteTask('${id}',${i})">🗑</button>
      </div>
    </div>`).join('')
  :`<div style="text-align:center;padding:16px;color:var(--text3);font-size:0.85rem;">No tasks yet. Add your first task below.</div>`;

  const dv=document.getElementById('goal-detail-view');
  dv.innerHTML=`
    <div class="detail-header">
      <button class="back-btn" onclick="closeGoalDetail()">← Back to Goals</button>
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="detail-title">${g.title}</div>
        <div style="display:flex;gap:8px">
          <button class="btn-ghost" onclick="editGoal('${id}')">Edit</button>
          <button class="btn-ghost" style="color:var(--red);border-color:var(--red)" onclick="deleteGoal('${id}')">Del</button>
        </div>
      </div>
      <div style="margin-top:8px">
        <span class="chip chip-${color}">${catEmoji(g.category)} ${capitalize(g.category)}</span>
        <span class="chip ${g.priority==='high'?'chip-red':g.priority==='low'?'chip-green':'chip-yellow'}">${priorityLabel(g.priority)}</span>
        ${g.dueDate?`<span class="chip chip-purple">📅 ${formatDateShort(g.dueDate)}</span>`:''}
      </div>
    </div>
    ${g.description?`<div class="card card-sm" style="margin-bottom:14px"><div style="font-size:0.85rem;color:var(--text2);line-height:1.6">${g.description}</div></div>`:''}
    <div class="card" style="margin-bottom:14px">
      <div class="big-pct">${pct}%</div>
      <div class="big-bar"><div class="big-fill fill-${color}" style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:0.75rem;color:var(--text2)">
        <span>${tasks.filter(t=>t.done).length} of ${tasks.length} tasks done</span>
        <div>
          <label style="font-size:0.75rem;color:var(--text2);margin-right:6px">Status:</label>
          <select class="form-select" style="padding:4px 8px;font-size:0.78rem;width:auto" onchange="updateStatus('${id}',this.value)">
            <option value="active" ${g.status==='active'?'selected':''}>Active</option>
            <option value="paused" ${g.status==='paused'?'selected':''}>Paused</option>
            <option value="done" ${g.status==='done'?'selected':''}>Done</option>
          </select>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="section-header" style="margin-bottom:8px"><div class="section-title">Tasks</div></div>
      ${taskHTML}
      <div class="divider"></div>
      <div class="add-task-row">
        <input class="form-input" id="new-task-input-${id}" placeholder="Add a task..."/>
        <input class="form-input" type="date" id="new-task-due-${id}" style="width:130px"/>
        <button class="btn-sm" onclick="addTask('${id}')">Add</button>
      </div>
    </div>`;

  document.getElementById('goal-list-view').style.display='none';
  dv.style.display='block';
}

function closeGoalDetail(){
  document.getElementById('goal-detail-view').style.display='none';
  document.getElementById('goal-list-view').style.display='block';
  renderGoalsList();
}

async function toggleTask(goalId, taskIdx){
  const g=goals.find(x=>x.id===goalId);
  if(!g||!g.tasks) return;
  g.tasks[taskIdx].done=!g.tasks[taskIdx].done;
  g.tasks[taskIdx].doneAt=g.tasks[taskIdx].done?new Date().toISOString():null;
  await saveGoalToFS(g);
  openGoalDetail(goalId);
  showToast(g.tasks[taskIdx].done?'✅ Task completed!':'↩️ Task reopened');
}

async function addTask(goalId){
  const input=document.getElementById('new-task-input-'+goalId);
  const dueInput=document.getElementById('new-task-due-'+goalId);
  const name=input.value.trim();
  if(!name) return;
  const g=goals.find(x=>x.id===goalId);
  if(!g) return;
  if(!g.tasks) g.tasks=[];
  g.tasks.push({name,done:false,due:dueInput.value||null,createdAt:new Date().toISOString()});
  await saveGoalToFS(g);
  openGoalDetail(goalId);
  showToast('Task added!');
}

async function deleteTask(goalId, taskIdx){
  if(!confirm('Delete this task?')) return;
  const g=goals.find(x=>x.id===goalId);
  if(!g||!g.tasks) return;
  g.tasks.splice(taskIdx,1);
  await saveGoalToFS(g);
  openGoalDetail(goalId);
}

async function updateStatus(goalId, status){
  const g=goals.find(x=>x.id===goalId);
  if(!g) return;
  g.status=status;
  await saveGoalToFS(g);
  showToast('Status updated!');
}

async function deleteGoal(id){
  if(!confirm('Delete this goal and all its tasks?')) return;
  await deleteGoalFromFS(id);
  goals=goals.filter(g=>g.id!==id);
  closeGoalDetail();
  showToast('Goal deleted.');
}

function editGoal(id){
  const g=goals.find(x=>x.id===id);
  if(!g) return;
  editingGoalId=id;
  document.getElementById('goal-modal-title').textContent='Edit Goal';
  document.getElementById('gm-title').value=g.title;
  document.getElementById('gm-desc').value=g.description||'';
  document.getElementById('gm-start').value=g.startDate||'';
  document.getElementById('gm-due').value=g.dueDate||'';
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('selected',b.dataset.cat===g.category));
  selectedCat=g.category;
  document.querySelectorAll('.priority-btn').forEach(b=>b.classList.toggle('selected',b.classList.contains(g.priority||'medium')));
  selectedPriority=g.priority||'medium';
  openModal('goal-modal');
}

// ═══════════════════════════════════════════
//  GOAL MODAL
// ═══════════════════════════════════════════
function openGoalModal(){
  editingGoalId=null;
  document.getElementById('goal-modal-title').textContent='New Goal';
  document.getElementById('gm-title').value='';
  document.getElementById('gm-desc').value='';
  document.getElementById('gm-start').value=todayISO();
  document.getElementById('gm-due').value='';
  selectedCat='personal';
  selectedPriority='medium';
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('selected',b.dataset.cat==='personal'));
  document.querySelectorAll('.priority-btn').forEach(b=>b.classList.toggle('selected',b.classList.contains('medium')));
  openModal('goal-modal');
}

function selectCat(btn){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedCat=btn.dataset.cat;
}

function selectPriority(btn, priority){
  document.querySelectorAll('.priority-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedPriority=priority;
}

async function saveGoal(){
  const title=document.getElementById('gm-title').value.trim();
  if(!title){showToast('Please enter a goal title.');return;}
  const g=editingGoalId?goals.find(x=>x.id===editingGoalId):{};
  g.title=title;
  g.description=document.getElementById('gm-desc').value.trim();
  g.category=selectedCat;
  g.priority=selectedPriority;
  g.startDate=document.getElementById('gm-start').value;
  g.dueDate=document.getElementById('gm-due').value;
  if(!g.status) g.status='active';
  if(!g.tasks) g.tasks=[];
  if(!g.createdAt) g.createdAt=new Date().toISOString();
  g.updatedAt=new Date().toISOString();
  await saveGoalToFS(g);
  if(!editingGoalId) goals.unshift(g);
  closeModal('goal-modal');
  showToast(editingGoalId?'Goal updated!':'New goal created! 🎯');
  renderDashboard();
  renderGoalsList();
}

// ═══════════════════════════════════════════
//  PROGRESS / REPORTS
// ═══════════════════════════════════════════
function switchReport(type, btn){
  currentReport=type;
  document.querySelectorAll('.report-tab').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderReports();
}

function renderReports(){
  const container=document.getElementById('report-content');
  if(currentReport==='overview') container.innerHTML=buildOverviewReport();
  else if(currentReport==='weekly') container.innerHTML=buildWeeklyReport();
  else container.innerHTML=buildMonthlyReport();
}

function buildOverviewReport(){
  const total=goals.length;
  const done=goals.filter(g=>g.status==='done').length;
  const active=goals.filter(g=>g.status==='active').length;
  const allTasks=goals.flatMap(g=>g.tasks||[]);
  const doneTasks=allTasks.filter(t=>t.done).length;
  const avgProgress=total?Math.round(goals.reduce((s,g)=>s+calcProgress(g),0)/total):0;
  const cats={personal:0,career:0,health:0,finance:0,learning:0,other:0};
  goals.forEach(g=>cats[g.category]=(cats[g.category]||0)+1);
  const catEntries=Object.entries(cats).filter(([,v])=>v>0);

  const bars=catEntries.map(([c,v])=>{
    const color={personal:'#6C5CE7',career:'#3B82F6',health:'#10B981',finance:'#F59E0B',learning:'#EC4899',other:'#A29BFE'}[c]||'#6C5CE7';
    const pct=Math.round(v/total*100);
    return `<div class="gpl-item">
      <div class="gpl-row"><div class="gpl-name">${catEmoji(c)} ${capitalize(c)}</div><div class="gpl-pct">${v} goal${v>1?'s':''} (${pct}%)</div></div>
      <div class="progress-bar" style="height:8px"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }).join('');

  const goalBars=goals.map(g=>{
    const p=calcProgress(g);
    const color={personal:'#6C5CE7',career:'#3B82F6',health:'#10B981',finance:'#F59E0B',learning:'#EC4899',other:'#A29BFE'}[g.category]||'#6C5CE7';
    return `<div class="gpl-item">
      <div class="gpl-row"><div class="gpl-name" style="font-size:0.82rem">${g.title}</div><div class="gpl-pct">${p}%</div></div>
      <div class="progress-bar" style="height:6px"><div class="progress-fill" style="width:${p}%;background:${color}"></div></div>
    </div>`;
  }).join('');

  return `<div class="metric-row">
    <div class="metric-box"><div class="metric-val">${avgProgress}%</div><div class="metric-lbl">Avg Progress</div></div>
    <div class="metric-box"><div class="metric-val">${doneTasks}</div><div class="metric-lbl">Tasks Done</div></div>
    <div class="metric-box"><div class="metric-val">${done}</div><div class="metric-lbl">Goals Done</div></div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div class="section-title" style="margin-bottom:14px">By Category</div>
    <div class="goal-progress-list">${bars||'<div class="empty-text">No goals yet.</div>'}</div>
  </div>
  <div class="card">
    <div class="section-title" style="margin-bottom:14px">Goal Progress</div>
    <div class="goal-progress-list">${goalBars||'<div class="empty-text">No goals yet.</div>'}</div>
  </div>`;
}

function buildWeeklyReport(){
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today=new Date();
  const dayBars=days.map((d,i)=>{
    const dt=new Date(today); dt.setDate(today.getDate()-today.getDay()+i);
    const dStr=dt.toISOString().split('T')[0];
    const doneTasks=goals.flatMap(g=>g.tasks||[]).filter(t=>t.done&&t.doneAt&&t.doneAt.startsWith(dStr)).length;
    const h=Math.min(60,doneTasks*12+4);
    const isToday=i===today.getDay();
    return `<div class="day-col">
      <div class="day-label">${d}</div>
      <div class="day-bar-wrap">
        <div class="day-bar" style="height:${h}px;background:${isToday?'var(--accent)':'var(--card2)'};border:1px solid var(--border)"></div>
      </div>
      <div class="day-pct">${doneTasks}</div>
    </div>`;
  }).join('');

  const weekTasks=goals.flatMap(g=>g.tasks||[]).filter(t=>t.done&&t.doneAt).filter(t=>{
    const d=new Date(t.doneAt); const diff=(today-d)/(1000*60*60*24); return diff<=7;
  }).length;
  const reflThisWeek=reflections.filter(r=>{
    const d=new Date(r.date); const diff=(today-d)/(1000*60*60*24); return diff<=7;
  }).length;

  return `<div class="metric-row">
    <div class="metric-box"><div class="metric-val">${weekTasks}</div><div class="metric-lbl">Tasks This Week</div></div>
    <div class="metric-box"><div class="metric-val">${reflThisWeek}</div><div class="metric-lbl">Reflections</div></div>
    <div class="metric-box"><div class="metric-val">${goals.filter(g=>g.status==='active').length}</div><div class="metric-lbl">Active Goals</div></div>
  </div>
  <div class="card">
    <div class="section-title" style="margin-bottom:12px">Tasks Completed This Week</div>
    <div class="weekly-grid">${dayBars}</div>
  </div>`;
}

function buildMonthlyReport(){
  const now=new Date();
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1).toISOString();
  const monthTasks=goals.flatMap(g=>g.tasks||[]).filter(t=>t.done&&t.doneAt&&t.doneAt>=monthStart).length;
  const newGoals=goals.filter(g=>g.createdAt>=monthStart).length;
  const reflThisMonth=reflections.filter(r=>r.date>=monthStart.split('T')[0]).length;
  const doneGoals=goals.filter(g=>g.status==='done'&&g.updatedAt&&g.updatedAt>=monthStart).length;

  const byPriority={high:0,medium:0,low:0};
  goals.forEach(g=>byPriority[g.priority||'medium']++);

  const mName=now.toLocaleString('default',{month:'long',year:'numeric'});
  return `<div class="card" style="margin-bottom:14px">
    <div class="section-title" style="margin-bottom:4px">${mName}</div>
    <div style="font-size:0.8rem;color:var(--text2);margin-bottom:14px">Monthly summary</div>
    <div class="metric-row">
      <div class="metric-box"><div class="metric-val">${monthTasks}</div><div class="metric-lbl">Tasks Done</div></div>
      <div class="metric-box"><div class="metric-val">${newGoals}</div><div class="metric-lbl">New Goals</div></div>
      <div class="metric-box"><div class="metric-val">${doneGoals}</div><div class="metric-lbl">Completed</div></div>
    </div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div class="section-title" style="margin-bottom:14px">Goals by Priority</div>
    ${['high','medium','low'].map(p=>`<div class="gpl-item">
      <div class="gpl-row"><div class="gpl-name">${priorityLabel(p)}</div><div class="gpl-pct">${byPriority[p]}</div></div>
      <div class="progress-bar" style="height:6px"><div class="progress-fill" style="width:${goals.length?byPriority[p]/goals.length*100:0}%;background:${p==='high'?'var(--red)':p==='low'?'var(--green)':'var(--yellow)'}"></div></div>
    </div>`).join('')}
  </div>
  <div class="card">
    <div class="section-title" style="margin-bottom:8px">Reflection Streak</div>
    <div style="font-size:2rem;font-weight:700;color:var(--accent2)">${reflThisMonth} <span style="font-size:1rem;font-weight:400;color:var(--text2)">entries this month</span></div>
  </div>`;
}

// ═══════════════════════════════════════════
//  CALENDAR
// ═══════════════════════════════════════════
function renderCalendar(){
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-month-label').textContent=monthNames[calMonth]+' '+calYear;
  const today=new Date();
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();

  // build date→goals map
  const dateGoals={};
  goals.forEach(g=>{
    if(g.dueDate) dateGoals[g.dueDate]=(dateGoals[g.dueDate]||[]).concat(g);
    if(g.startDate) dateGoals[g.startDate]=(dateGoals[g.startDate]||[]).concat(g);
  });
  reflections.forEach(r=>{
    if(r.date) dateGoals[r.date]=(dateGoals[r.date]||[]).concat({title:'Reflection '+r.mood,isRef:true});
  });

  let html='<div class="cal-day-label">S</div><div class="cal-day-label">M</div><div class="cal-day-label">T</div><div class="cal-day-label">W</div><div class="cal-day-label">T</div><div class="cal-day-label">F</div><div class="cal-day-label">S</div>';

  for(let i=0;i<firstDay;i++){
    const d=daysInPrev-firstDay+1+i;
    html+=`<div class="cal-cell other-month">${d}</div>`;
  }
  for(let d=1;d<=daysInMonth;d++){
    const iso=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=d===today.getDate()&&calMonth===today.getMonth()&&calYear===today.getFullYear();
    const hasGoals=!!dateGoals[iso]?.length;
    const isSel=iso===selectedCalDay;
    html+=`<div class="cal-cell ${isToday?'today':''} ${hasGoals?'has-goals':''} ${isSel?'selected':''}" onclick="selectCalDay('${iso}')">${d}</div>`;
  }
  const remain=(7-((firstDay+daysInMonth)%7))%7;
  for(let i=1;i<=remain;i++) html+=`<div class="cal-cell other-month">${i}</div>`;

  document.getElementById('cal-grid').innerHTML=html;

  // events panel
  const evContainer=document.getElementById('cal-events');
  if(selectedCalDay && dateGoals[selectedCalDay]?.length){
    const items=dateGoals[selectedCalDay];
    evContainer.innerHTML=`<div class="section-title" style="margin-bottom:12px">Events on ${formatDateShort(selectedCalDay)}</div>`+
      items.map(item=>{
        const color=item.isRef?'#A29BFE':catColor(item.category);
        return `<div class="cal-event-item">
          <div class="cal-event-dot" style="background:${color}"></div>
          <div><div class="cal-event-text">${item.title}</div><div class="cal-event-meta">${item.isRef?'Reflection':capitalize(item.category)}</div></div>
        </div>`;
      }).join('');
  } else if(selectedCalDay){
    evContainer.innerHTML=`<div style="text-align:center;padding:20px;color:var(--text3);font-size:0.85rem">No events on ${formatDateShort(selectedCalDay)}</div>`;
  } else {
    evContainer.innerHTML=`<div style="text-align:center;padding:20px;color:var(--text3);font-size:0.85rem">Tap a date to see events</div>`;
  }
}

function selectCalDay(iso){
  selectedCalDay=selectedCalDay===iso?null:iso;
  renderCalendar();
}

function calNav(dir){
  calMonth+=dir;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  renderCalendar();
}

// ═══════════════════════════════════════════
//  REFLECTION
// ═══════════════════════════════════════════
function renderReflections(){
  const container=document.getElementById('reflection-list');
  if(!reflections.length){
    container.innerHTML=`<div class="empty-state"><div class="empty-icon">✍️</div><div class="empty-text">Start your reflection journey today!</div><button class="btn-sm" onclick="openReflectionModal()">Write First Entry</button></div>`;
    return;
  }
  container.innerHTML=reflections.map(r=>`
    <div class="ref-entry">
      <div class="ref-entry-head">
        <div class="ref-entry-date">📅 ${formatDateLong2(r.date)}</div>
        <div class="ref-entry-mood">${r.mood||'🙂'}</div>
      </div>
      <div class="ref-entry-body">
        ${r.win?`<div class="win-item"><div class="win-icon">⭐</div><div class="win-text"><strong>Wins:</strong> ${r.win}</div></div>`:''}
        ${r.improve?`<div class="win-item"><div class="win-icon">🔧</div><div class="win-text"><strong>Improve:</strong> ${r.improve}</div></div>`:''}
        ${r.gratitude?`<div class="win-item"><div class="win-icon">🙏</div><div class="win-text"><strong>Grateful:</strong> ${r.gratitude}</div></div>`:''}
      </div>
    </div>`).join('');
}

function openReflectionModal(){
  document.getElementById('ref-win').value='';
  document.getElementById('ref-improve').value='';
  document.getElementById('ref-gratitude').value='';
  selectedMood='🙂';
  document.querySelectorAll('.mood-btn').forEach(b=>b.classList.toggle('selected',b.textContent==='🙂'));
  openModal('reflection-modal');
}

function selectMood(btn,mood){
  document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedMood=mood;
}

async function saveReflection(){
  const win=document.getElementById('ref-win').value.trim();
  const improve=document.getElementById('ref-improve').value.trim();
  const gratitude=document.getElementById('ref-gratitude').value.trim();
  if(!win&&!improve&&!gratitude){showToast('Please write something before saving.');return;}
  const r={
    date:todayISO(),
    mood:selectedMood,
    win,improve,gratitude,
    createdAt:new Date().toISOString()
  };
  // remove duplicate for today
  const existing=reflections.find(x=>x.date===todayISO());
  if(existing){r.id=existing.id;reflections=reflections.filter(x=>x.id!==existing.id);}
  await saveReflectionToFS(r);
  reflections.unshift(r);
  closeModal('reflection-modal');
  renderReflections();
  showToast("Reflection saved! ✨");
}

// ═══════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
// close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function todayISO(){return new Date().toISOString().split('T')[0];}

function formatDateShort(iso){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}
function formatDateLong(d){
  return d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function formatDateLong2(iso){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

function capitalize(s){return s?s[0].toUpperCase()+s.slice(1):'';}
function catEmoji(c){return{personal:'🧘',career:'💼',health:'💪',finance:'💰',learning:'📚',other:'✨'}[c]||'✨';}
function catColor(c){return{personal:'#6C5CE7',career:'#3B82F6',health:'#10B981',finance:'#F59E0B',learning:'#EC4899',other:'#A29BFE'}[c]||'#6C5CE7';}
function priorityLabel(p){return{high:'🔴 High',medium:'🟡 Medium',low:'🟢 Low'}[p]||'🟡 Medium';}

// Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./gp-sw.js').catch(()=>{});
}
